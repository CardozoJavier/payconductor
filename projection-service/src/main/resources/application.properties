quarkus.application.name=projection-service

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:payconductor}
quarkus.datasource.password=${DB_PASSWORD:payconductor}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/payconductor_projections
quarkus.datasource.jdbc.max-size=10

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Kafka (SmallRye Reactive Messaging)
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.payment-events.connector=smallrye-kafka
mp.messaging.incoming.payment-events.topic=payment.events
mp.messaging.incoming.payment-events.group.id=projection-service
mp.messaging.incoming.payment-events.auto.offset.reset=earliest
mp.messaging.incoming.payment-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Observability
quarkus.micrometer.export.prometheus.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
quarkus.log.level=INFO
quarkus.log.category."io.payconductor".level=DEBUG

# Native image config — memory tuning for low-footprint query side
quarkus.native.additional-build-args=-J-Xmx64m
